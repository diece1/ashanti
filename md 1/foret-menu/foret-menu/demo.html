<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Forêt des Ancêtres — Menu (démo)</title><link rel="stylesheet" href="foret-menu.css">
<style>html,body{margin:0;height:100%;background:#000;color:#ddd;font-family:sans-serif}#hint{position:fixed;left:8px;top:8px;font-size:12px;opacity:.6}</style></head>
<body><div id="hint">Démo du jeu : Échap = pause</div>
<script src="foret-menu.js"></script>
<script>
let saves=[{zone:'Zone 2 — Vallée des Âmes',temps:4320,hp:3,max:5,ames:240,boss:[true,false,false]},null,{zone:'Zone 5 — Trône des Ancêtres',temps:15300,hp:5,max:6,ames:1210,boss:[true,true,false]}];
FDAMenu.init({version:'v0.1',
  hasSave:()=>saves.some(Boolean), continueInfo:()=>'Zone 2 · 1 h 12',
  slots:()=>saves,
  getList:k=>({bestiary:[{id:'e1',title:'Esprit égaré',text:'Une âme sans chemin. Inoffensive tant qu\'on ne la menace pas.'},{id:'e2',title:'Tisseuse',text:'Lance des toiles paralysantes.'},{id:'e3',locked:true}],
    memories:[{id:'m1',title:'La voix des arbres',text:'On dit que chaque arbre garde la voix d\'un ancêtre.'},{id:'m2',locked:true}],
    bossmode:[{id:'mokele',title:'Mokélé',text:'Le Gardien des Racines'},{id:'nguema',title:'Nguéma',text:'Le Dévoreur des Âmes'},{id:'akuma',title:'Akuma',text:'Le Roi Ancestral',locked:true}]}[k]),
  onAction:(a,d)=>{window.lastAction=[a,d];console.log('action',a,d)}});
FDAMenu.show('main');
addEventListener('keydown',e=>{if(e.key==='Escape'&&!FDAMenu.isOpen())FDAMenu.show('pause')});
</script></body></html>
